<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sala de Crisis Opella</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sala de mando proyectada — barra superior con avance por evento, contenido al centro, navegación del facilitador fija abajo */
:root{
  color-scheme: dark;
  --bg:#03230d;
  --bg-2:#062f14;
  --panel:#0a3a1b;
  --line:rgba(246,239,228,.14);
  --line-2:rgba(246,239,228,.28);
  --cream:#f6efe4;
  --muted:#a8bca9;
  --pink:#ff74cf;
  --pink-dim:rgba(255,116,207,.16);
  --on-pink:#2a0820;
  --fisa-head:#123f20;
  --imp-col0:#1a4527;
  --imp-col:#14381f;
  --good:#86dba6;
  --warn:#f3c55a;
  --bad:#ff8574;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
img,video{max-width:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--cream);font-family:var(--f-body);font-size:17px;line-height:1.5;
  background-image:radial-gradient(1200px 600px at 85% -10%,rgba(255,116,207,.07),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(134,219,166,.06),transparent 60%)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--pink);font-weight:700}
.hint{font-size:14px;color:var(--muted)}
.app{min-height:100%;display:flex;flex-direction:column}

/* barra superior */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(3,35,13,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hud-row{display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:19px}
.brand span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--pink);font-weight:700}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:11px;padding:4px 8px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.chip.on{border-color:var(--pink);color:var(--cream);background:var(--pink-dim)}
.chip.past{color:var(--cream);border-color:var(--line-2)}
.elapsed{font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap}
.elapsed b{color:var(--cream);font-weight:600;font-variant-numeric:tabular-nums}

main{flex:1;width:100%;max-width:1200px;margin:0 auto;padding-inline:20px;padding-block:28px 120px}
.head{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.head h2{font-size:clamp(30px,4.2vw,52px);font-weight:800;font-stretch:88%;line-height:1;letter-spacing:-.02em}
.head .when{font-family:var(--f-mono);color:var(--muted);font-size:14px;margin-left:auto}

/* botones */
.btn{padding:12px 18px;border-radius:8px;border:1px solid var(--cream);background:var(--cream);color:var(--bg);font-weight:700;font-size:15px}
.btn.ghost{background:transparent;color:var(--cream);border-color:var(--line-2)}
.btn.pink{background:var(--pink);border-color:var(--pink);color:var(--on-pink)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.actions{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}

/* intro */
.intro{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:48px;align-items:start;padding-top:16px}
.intro h1{font-size:clamp(28px,3.4vw,44px);font-weight:900;font-stretch:80%;line-height:.92;letter-spacing:-.03em;margin:14px 0 22px}
.intro .eyebrow{font-size:11px}
.intro h1 em{font-style:normal;color:var(--pink)}
.ctx{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--pink);border-radius:12px;padding:18px 20px;margin-bottom:20px}
.ctx p{margin:6px 0 0;font-size:14.5px;line-height:1.45;max-width:58ch}
.howto{display:grid}
.howto div{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.howto b.n{font-family:var(--f-mono);color:var(--pink);font-size:12.5px;padding-top:2px}
.howto strong{display:block;font-family:var(--f-display);font-size:15.5px}
.howto span{color:var(--muted);font-size:13.5px}
.facts{display:flex;gap:22px;flex-wrap:wrap;margin:0;font-size:15px}
.side-facts{padding-top:14px;border-top:1px solid var(--line)}
.facts div{display:flex;flex-direction:column}
.facts small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--pink);font-weight:700}
.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:14px}
.side h3{font-size:20px}
.field label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
input[type=text],textarea{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg);color:var(--cream);font:inherit;font-size:16px}
textarea{min-height:110px;resize:vertical;line-height:1.45}
.cta{width:100%;padding:16px 18px;border-radius:10px;border:0;background:var(--pink);color:var(--on-pink);font-family:var(--f-display);font-weight:800;font-size:20px}
.past-list{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:stretch}
.popen{display:flex;justify-content:space-between;gap:10px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;font-size:14px;min-width:0}
.popen:hover{border-color:var(--line-2)}
.popen span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.past-list small{color:var(--muted);font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.pdel{padding:0 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--muted);font-size:13px}
.pdel:hover{border-color:var(--bad);color:var(--bad)}
.prow.confirm{grid-template-columns:1fr;padding:12px;border:1px solid var(--bad);border-radius:8px;font-size:14px;background:rgba(255,133,116,.08)}
.pbtns{display:flex;gap:8px;flex-wrap:wrap}
.pbtns .btn{padding:8px 14px;font-size:14px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#2b0703}

/* video */
.vwrap{border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--line-2)}
.vid{display:block;width:100%;aspect-ratio:16/9;max-height:calc(100vh - 300px);background:#000}
.vempty{aspect-ratio:16/9;max-height:calc(100vh - 300px);width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;background:repeating-linear-gradient(135deg,var(--bg-2) 0 14px,var(--bg) 14px 28px)}
.vempty .miss{font-family:var(--f-display);font-weight:900;font-stretch:85%;font-size:clamp(34px,5vw,64px);color:var(--pink);letter-spacing:-.01em;line-height:1}
.vempty span{color:var(--muted);max-width:48ch;font-size:15px}
.vst{color:var(--warn)}
.evtext{margin:16px 0 0;font-size:18px;max-width:75ch;color:var(--cream)}
.evtext p{margin:0 0 10px}
.evtext b{color:var(--pink);font-weight:700}

/* crisis + áreas */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px;min-width:0}
.card h3{font-size:22px;margin-bottom:6px}
.card p{margin:0 0 12px;color:var(--muted);font-size:15px}
.rgroup{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--pink);font-weight:700;margin:14px 0 6px}
.role-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.role{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;text-align:left;min-width:0}
.role .dot{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--line-2);flex:none;margin-top:3px}
.role.on{border-color:var(--cream)}
.role.on .dot{background:var(--pink);border-color:var(--pink)}
.role .rt{display:flex;flex-direction:column;min-width:0}
.role .rt b{font-size:14.5px;line-height:1.25}
.role .rt small{font-size:12px;color:var(--muted)}
.role:disabled{cursor:default}
.role .rwhy{font-size:12.5px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);line-height:1.4}
.vd{display:block;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.vd.good{color:var(--good)}.vd.bad{color:var(--bad)}
.role.rv-good{border-color:var(--good)}
.role.rv-bad{border-color:var(--bad)}
.role.miss{border-style:dashed}
.role.rv-good.on .dot{background:var(--good);border-color:var(--good)}
.role.rv-bad.on .dot{background:var(--bad);border-color:var(--bad)}

/* preguntas */
.qa{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.qlist{list-style:none;margin:0;padding:0}
.qlist li{padding:16px 0 16px 26px;border-top:1px solid var(--line);position:relative;font-size:clamp(20px,2.1vw,27px);line-height:1.35}
.qlist li::before{content:"";position:absolute;left:0;top:28px;width:10px;height:10px;border-radius:50%;background:var(--pink)}
.timer{position:sticky;top:90px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;text-align:center;display:grid;gap:12px}
.timer .lab{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.timer .t{font-family:var(--f-mono);font-size:64px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.timer.low .t{color:var(--warn)}
.timer.end .t{color:var(--bad)}
.timer .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ring{height:6px;border-radius:3px;background:rgba(246,239,228,.12);overflow:hidden}
.ring i{display:block;height:100%;background:var(--pink);transition:width 1s linear}
.answers{margin-top:26px;display:grid;gap:16px}
.answers h3{font-size:24px}
.ans label{display:block;font-size:15px;margin-bottom:6px}
.ans label b{color:var(--pink);font-family:var(--f-mono);font-size:13px;margin-right:6px}
.check{margin-top:26px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--good);border-radius:12px;padding:20px 22px}
.check h3{font-size:clamp(24px,2.6vw,32px);margin-bottom:10px}
.check p{margin:0 0 10px;color:var(--muted);font-size:14px}
.ck{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line);font-size:clamp(17px,1.7vw,20px);cursor:pointer}
.ck input{width:20px;height:20px;margin-top:4px;accent-color:var(--good)}
.ck.none{border-top:1px dashed var(--line-2);margin-top:4px;color:var(--muted)}
.ck.none input{accent-color:var(--bad)}
.saved{font-family:var(--f-mono);font-size:12px;color:var(--good)}

/* cierre y reporte */
.lessons{margin:0;padding-left:20px;display:grid;gap:8px;font-size:16.5px}
.rep{display:grid;gap:22px}
.rep-head{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.rep-head div{border-top:3px solid var(--pink);padding-top:10px;min-width:0}
.rep-head b{display:block;font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.rep-head span{font-size:13px;color:var(--muted)}
.rsec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px;min-width:0}
.rsec h3{font-size:21px;margin-bottom:4px}
.rsec .meta{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);margin-bottom:12px}
.rq{padding:12px 0;border-top:1px solid var(--line)}
.rq .q{font-weight:700}
.rq .a{margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--cream)}
.rq .a.empty{color:var(--muted);font-style:italic}
.chk-list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px;font-size:15px}
.chk-list li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.chk-list .y{color:var(--good);font-weight:700}
.chk-list .n{color:var(--bad);font-weight:700}
.area-recap{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.area-recap span{font-size:13.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2)}
.area-recap span.good{border-color:var(--good)}
.area-recap span.bad{border-color:var(--bad)}
.notice{font-size:14px;color:var(--warn)}


/* etapa: barra de tiempo, pestañas */
.stagebar{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 20px;margin-bottom:14px}
.stagebar .tblock{display:flex;flex-direction:column;gap:2px}
.stagebar .lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stagebar .t{font-family:var(--f-mono);font-size:44px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.stagebar.low .t{color:var(--warn)}
.stagebar.end .t{color:var(--bad)}
.stagebar .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.hint.over{color:var(--bad)}
.lockmsg{border:1px dashed var(--pink);border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:15px;background:var(--pink-dim)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tab{background:transparent;border:0;border-bottom:3px solid transparent;padding:10px 16px;font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--muted);display:flex;align-items:baseline;gap:8px;margin-bottom:-1px}
.tab small{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--muted)}
.tab.on{color:var(--cream);border-bottom-color:var(--pink)}
.tab.on small{color:var(--pink)}
.tab:hover{color:var(--cream)}
.tabpane{min-height:120px}
textarea:disabled,input:disabled,select:disabled{opacity:.55;cursor:not-allowed}
.ans .aname{font-family:var(--f-display);font-weight:700;color:var(--pink)}
.btn.sm{padding:6px 12px;font-size:13px}
.foot-timer{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;padding-right:8px;border-right:1px solid var(--line)}
.foot-timer.low span{color:var(--warn)}
.foot-timer.end span{color:var(--bad)}
.foot-timer .btn{min-width:0}

/* FISA */
.chooser{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--pink);border-radius:12px;padding:20px 22px}
.chooser h3{font-size:22px;margin-bottom:6px}
.chooser p{margin:0;color:var(--muted);font-size:15px;max-width:70ch}
.fmode{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.fisa-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.fisa-top h3{font-size:24px}
.fisa-banner{background:var(--fisa-head);border:1px solid var(--line-2);color:var(--pink);font-family:var(--f-display);font-weight:800;font-size:clamp(16px,2vw,22px);letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:8px 12px;border-radius:6px;margin-bottom:14px}
.fisa-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:stretch}
.fcol{display:flex;flex-direction:column;min-width:0}
.fcol h4{margin:0;background:var(--fisa-head);color:var(--cream);font-family:var(--f-display);font-size:19px;font-weight:800;padding:12px 14px;border-radius:8px 8px 0 0}
.fcol h4 span,.fhead span{color:var(--pink)}
.fhead{display:flex;align-items:center;gap:6px;width:100%;text-align:left;margin:0;background:var(--fisa-head);color:var(--cream);font-family:var(--f-display);font-size:19px;font-weight:800;padding:12px 14px;border:0;border-radius:8px 8px 0 0}
.fhead i{margin-left:auto;font-style:normal;font-family:var(--f-body);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--on-pink);background:var(--pink);padding:3px 8px;border-radius:999px}
.fhead:hover:not(:disabled){outline:2px solid var(--pink);outline-offset:-2px}
.fhead:disabled{cursor:not-allowed}
.fhead:disabled i{opacity:.5}
.fbody{flex:1;border:1px solid var(--line-2);border-top:0;border-radius:0 0 8px 8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg-2)}
.fitem{position:relative;text-align:left;width:100%;border:1px solid var(--line);border-radius:8px;background:rgba(246,239,228,.03);padding:10px 10px 10px 30px;font-size:14.5px;line-height:1.35;display:flex;flex-direction:column;gap:4px}
button.fitem:hover:not(:disabled){border-color:var(--pink)}
.fitem::before{content:"";position:absolute;left:11px;top:14px;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line-2)}
.fitem.done::before{background:var(--good);border-color:var(--good)}
.fitem small{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.fitem small.full{white-space:pre-wrap;color:var(--cream)}
.fitem:disabled{cursor:not-allowed;opacity:.6}
.fsel{list-style:none;margin:2px 0 0;padding:8px 0 0;border-top:1px dashed var(--line-2);display:grid;gap:6px;font-size:13px}
.fsel li{display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.fsel b{color:var(--cream);font-size:13px}
.fsel .who{color:var(--muted);font-size:12px}
.fnoact{margin:4px 0 0;padding-top:8px;border-top:1px dashed var(--line-2);font-size:12.5px;color:var(--warn)}
.fnoact b{color:var(--warn)}
.fnoact.ok{color:var(--good)}
.lateadd{margin-top:18px;padding:10px 14px;border:1px dashed var(--line-2);border-radius:10px}
.lateadd summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--muted)}
.lateadd summary:hover,.lateadd[open] summary{color:var(--pink)}
.lrow{display:flex;gap:8px;flex-wrap:wrap}
.lrow select{flex:1;min-width:200px}
.fempty{margin:0;font-size:12.5px;color:var(--muted)}
.cls{display:inline-block;align-self:flex-start;font-family:var(--f-mono);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:4px;border:1px solid}
.cls.aliada{color:var(--good);border-color:var(--good)}
.cls.neutral{color:var(--warn);border-color:var(--warn)}
.cls.hostil{color:var(--bad);border-color:var(--bad)}

/* ventana */
.modal{position:fixed;inset:0;z-index:60;background:rgba(1,12,4,.72);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow:hidden}
.mbox{background:var(--bg-2);border:1px solid var(--line-2);border-radius:14px;width:min(760px,100%);max-height:calc(100% - 8px);overflow:auto;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.mbox.wide{width:min(1180px,100%)}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;position:sticky;top:-22px;background:var(--bg-2);padding:8px 0;z-index:2}
.mhead h3{font-size:22px}
.mhint{margin:0 0 14px;color:var(--muted);font-size:15px}
.impwrap{overflow-x:auto}
.imp{display:grid;grid-template-columns:170px repeat(3,minmax(200px,1fr));gap:4px;min-width:780px}
.imp .ih{font-family:var(--f-display);font-weight:800;font-size:18px;text-align:center;padding:10px;background:var(--imp-col);color:var(--cream)}
.imp .ih.first{background:var(--fisa-head)}
.imp .ih.c0,.imp .cell.c0{background:var(--imp-col0)}
.imp .rh{display:flex;align-items:center;gap:10px;background:var(--fisa-head);padding:10px 12px;font-weight:700;font-size:14.5px;border-right:3px dotted var(--line-2)}
.imp .rh svg{width:30px;height:30px;flex:none;fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.imp .cell{background:var(--imp-col);padding:6px;display:flex;flex-direction:column;gap:6px;border:2px solid transparent}
.imp .cell.isimp{border-color:var(--pink)}
.imp.ro .cell p{margin:0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.imp.ro .cell{min-height:56px}
.impflag{align-self:flex-start;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--pink);color:var(--on-pink);padding:2px 8px;border-radius:999px}
.rimpev{margin:10px 0 0;font-size:14.5px;white-space:pre-wrap}
.rimpev .empty,.imp.ro .empty{color:var(--muted);font-style:italic}
.imp .cell textarea{min-height:78px;font-size:14px;background:var(--bg);padding:8px}
.impbtn{align-self:flex-start;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--muted)}
.impbtn.on{background:var(--pink);border-color:var(--pink);color:var(--on-pink);font-weight:700}
.sugs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.sug{font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line-2);background:transparent}
.sug:hover{border-color:var(--pink)}
.rows{display:grid;gap:8px}
.rowh,.rowed{display:grid;gap:8px;align-items:center}
.rowh{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rowh.p,.rowed.p{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1.3fr) auto}
.rowh.a,.rowed.a{grid-template-columns:minmax(0,2.2fr) minmax(0,1.2fr) minmax(0,1.2fr) auto}
select{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg);color:var(--cream);font:inherit;font-size:15px}
.rdel{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px}
.rdel:hover{border-color:var(--bad);color:var(--bad)}

/* reporte: subtítulos y FISA */
.rsub{font-family:var(--f-body);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--pink);margin:18px 0 4px}
.fis-rep{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 22px;padding:10px 0;border-top:1px solid var(--line)}
.fis-rep h5{margin:0 0 6px;font-family:var(--f-display);font-size:16px;color:var(--cream)}
.fis-rep p{margin:0 0 6px;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.fis-rep ul{margin:0 0 6px;padding-left:18px;font-size:14.5px;display:grid;gap:4px;overflow-wrap:anywhere}
.fis-rep .empty{color:var(--muted);font-style:italic}

.langpick{display:grid;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.langbtns{display:flex;gap:6px;flex-wrap:wrap}
.langbtn{flex:1;min-width:90px;padding:9px 12px;border-radius:8px;border:1px solid var(--line-2);background:transparent;color:var(--cream);font-weight:700;font-size:14px}
.langbtn:hover{border-color:var(--pink)}
.langbtn.on{background:var(--pink);border-color:var(--pink);color:var(--on-pink)}
.langbadge{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--cream);border:1px solid var(--line-2);border-radius:4px;padding:1px 6px;text-transform:none}
.plang{font-family:var(--f-mono);font-size:10.5px;color:var(--pink);margin-left:4px}
/* pie */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(3,35,13,.95);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px}
.foot .where{font-size:13px;color:var(--muted);margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot .btn{min-width:130px}

@media (max-width:1100px){
  .fisa-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .stagebar{grid-template-columns:1fr}
  .stagebar .row{justify-content:flex-start}
  .intro,.two,.qa{grid-template-columns:1fr}
  .timer{position:static}
  .chips{display:none}
  .rep-head{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .fisa-grid{grid-template-columns:1fr}
  .fis-rep{grid-template-columns:1fr}
  .rowh{display:none}
  .rowed.p,.rowed.a{grid-template-columns:1fr;padding:10px;border:1px solid var(--line);border-radius:8px}
  .foot-timer{font-size:15px}
  .role-grid{grid-template-columns:1fr}
  .foot .btn{min-width:0;flex:1}
  .foot .where{display:none}
  .brand span{display:none}
  .timer .t{font-size:52px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  LANG = CONTENT[l] ? l : "es";
  const c = CONTENT[LANG];
  CONTEXTO = c.context;
  EVENTS = EVENT_BASE.map((b,i)=>Object.assign({}, b, c.events[i]));
  CLOSING_Q = c.closing; LESSONS = c.lessons;
  FINAL = FINAL_KEYS.map(k=>({k, label:c.final[k]}));
  ROLES = ROLE_BASE.map(r=>Object.assign({}, r, {es:c.roles[r.k][0], why:c.roles[r.k][1]}));
  FISA_H = FISA_KEYS.map(k=>({k, pre:c.fisa[k][0], b:c.fisa[k][1], hint:c.fisa[k][2]}));
  IMP_ROWS = IMP_ROW_KEYS.map(k=>({k, label:c.impRows[k]}));
  IMP_COLS = IMP_COL_KEYS.map(k=>({k, label:c.impCols[k]}));
  CLASES = CLASE_KEYS.map(k=>({k, label:c.clases[k]}));
  PARTES_SUG = c.sugs;

   ========================================================= */
function fresh(){
  return {id:null, lang:LANG, team:"", started:null, ended:null, step:-1,
    why:"", roles:[], areasDone:false, lateAreas:[],
    qa:{}, closing:["","","",""], final:{mejorar:"",recomendaciones:"",observaciones:"",positivo:""}};
}
let S = fresh();
let PAST = [], DEL_ID = null, DEL_MSG = "";
const A = k => S.roles.includes(k);
const rv = r => r.need ? (A(r.k)?"good":"bad") : (A(r.k)?"bad":"good");
function emptyFisa(){ return {mode:null, hechos:{evaluacion:"",recopilacion:"",compartir:"",perimetro:""}, impactos:{cells:{}, evaluacion:""}, partes:[], plan:[]}; }
function Q(ev){
  let q = S.qa[ev];
  if (!q) q = S.qa[ev] = {left:EVENTS[ev].min*60, used:0, started:false, saved:false, answers:EVENTS[ev].qs.map(()=>""), checks:EVENTS[ev].chk.map(()=>false), none:false};
  if (q.started==null) q.started = !!(q.used>0 || q.timerDone);
  if (!q.fisa) q.fisa = emptyFisa();
  if (!q.areas) q.areas = {};
  return q;
}
const has = t => !!(t && String(t).trim());
/* Áreas involucradas: las activadas al inicio + las que se agregan después desde el plan de acción */
function involved(){ const late = (S.lateAreas||[]).map(x=>x.k); return [...S.roles, ...late.filter(k=>!S.roles.includes(k))]; }
function noAction(f){ return involved().filter(k=>!f.plan.some(p=>p.area===k && has(p.accion))); }
const clip = (t,n) => { t = String(t||"").trim(); return t.length>n ? t.slice(0,n-1)+"…" : t; };
function prevFisa(si){ if (si<=0) return null; const q = S.qa[STAGES[si-1].ev]; return q && q.fisa ? q.fisa : null; }
function selImpacts(f){ return IMP_ROWS.flatMap(r=>IMP_COLS.map(c=>{ const x = f.impactos.cells[r.k+"|"+c.k]; return x && x.imp && has(x.text) ? {row:r.label, col:c.label, text:x.text} : null; })).filter(Boolean); }
function fisaHasContent(f){ if (!f) return false; return Object.values(f.hechos).some(has) || Object.values(f.impactos.cells).some(c=>has(c.text)) || has(f.impactos.evaluacion) || f.partes.some(p=>has(p.nombre)) || f.plan.some(p=>has(p.accion)); }
function fisaCount(f){ return [Object.values(f.hechos).some(has), selImpacts(f).length>0 || has(f.impactos.evaluacion), f.partes.some(p=>has(p.nombre)), f.plan.some(p=>has(p.accion))].filter(Boolean).length; }

/* =========================================================
   GUARDADO (db compartida + respaldo local)
   ========================================================= */
let DB = null, DL = null, saveT = null;
function localSessions(){ try{ return JSON.parse(localStorage.getItem("crisis-sessions")||"{}") || {}; }catch(e){ return {}; } }
function writeLocalSessions(m){ try{ localStorage.setItem("crisis-sessions", JSON.stringify(m)); }catch(e){} }
function loadLocalPast(){ PAST = Object.values(localSessions()).filter(x=>x && x.started).sort((a,b)=>b.started-a.started); }
function persist(now){
  clearTimeout(saveT);
  const go = ()=>{
    if (!S.id) return;
    const data = JSON.parse(JSON.stringify(S));
    data.updated = Date.now();
    try{ localStorage.setItem("crisis-current", JSON.stringify(data)); }catch(e){}
    const m = localSessions(); m[S.id] = data; writeLocalSessions(m);
    if (!DB){ loadLocalPast(); }
    if (DB) DB.doc("sesiones/"+S.id).set(data).catch(()=>{});
  };
  if (now) go(); else saveT = setTimeout(go, 700);
}

const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => { s = Math.max(0, Math.round(s)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };
const fmtMin = s => { s=Math.round(s||0); const m=Math.floor(s/60), r=s%60; return m ? `${m} min ${r ? r+" s" : ""}`.trim() : `${r} s`; };
const fmtDate = d => d ? new Date(d).toLocaleString(LOCALE[LANG]||"es-CO",{dateStyle:"medium",timeStyle:"short"}) : "—";

/* =========================================================
   RENDER
   ========================================================= */
function paintShell(){
  $("#brandTitle").textContent = t("brandTitle"); $("#brandSub").textContent = t("brandSub");
  $("#elapsedLab").textContent = t("elapsed"); $("#prev").textContent = t("back");
  const lb = LANGS.find(x=>x.k===LANG); $("#langBadge").textContent = lb ? lb.short : "";
}
function render(){
  paintShell();
  const intro = S.step < 0;
  $("#hud").hidden = intro; $("#foot").hidden = intro;
  if (intro){ $("#footTimer").hidden = true; renderIntro(); return; }
  const st = STEPS[S.step];
  renderChips(st);
  let h = "";
  if (st.t==="video") h = renderVideoStep(st.ev);
  else if (st.t==="crisis") h = renderCrisis();
  else if (st.t==="qa") h = renderQA(st.ev);
  else if (st.t==="closing") h = renderClosing();
  else if (st.t==="final") h = renderFinal();
  else if (st.t==="report") h = renderReport();
  stopAllAudio();
  $("#main").innerHTML = h;
  renderFoot();
  paintTimer();
  if (st.t==="video") setupMedia();

/* Carpetas por idioma: videos/ES|EN|PO y audios/ES|EN|PO. Si falta el archivo del idioma, se usa el de ES. */
const mediaPath = (kind, id, folder) => `${kind}/${folder}/${id.replace("e","evento")}.${kind==="videos"?"mp4":"mp3"}`;
function mediaFor(id){ const f = MEDIA_FOLDER[LANG] || "ES"; return {video:mediaPath("videos", id, f), audio:mediaPath("audios", id, f), vES:mediaPath("videos", id, "ES"), aES:mediaPath("audios", id, "ES")}; }
function renderVideoStep(ev){
  const e = EVENTS[ev], m = mediaFor(e.id);
  let h = `<div class="head"><div><div class="eyebrow">${t("eventOf", e.n)}</div><h2>${t("event", e.n)}</h2></div><div class="when">${esc(e.when)}</div></div>`;
  h += `<div class="vwrap"><video class="vid" id="evVideo" src="${esc(m.video)}" data-fallback="${esc(m.vES)}" controls loop autoplay muted playsinline preload="auto"></video></div>`;
  h += `<audio id="evAudio" src="${esc(m.audio)}" data-fallback="${esc(m.aES)}" preload="auto"></audio>`;
  h += `<div class="actions"><button class="btn pink" id="soundOn" hidden>${t("soundOn")}</button><button class="btn ghost" id="replayAudio" hidden>${t("replay")}</button><span class="hint" id="audioHint"></span></div>`;
  h += `<div class="evtext">${e.text.split(/\n\n+/).map((x,i)=> i===0 && e.lead && x.startsWith(e.lead) ? `<p><b>${esc(e.lead)}</b>${esc(x.slice(e.lead.length))}</p>` : `<p>${esc(x)}</p>`).join("")}</div>`;
  return h;
}
function stopAllAudio(){ document.querySelectorAll("audio").forEach(a=>{ try{ a.pause(); }catch(e){} }); }
/* El audio arranca con el video, suena una sola vez y sigue las pausas del video */
function setupMedia(){
  const v = $("#evVideo"), a = $("#evAudio"); if (!v || !a) return;
  let started = false;
  const hint = $("#audioHint"), btn = $("#soundOn"), again = $("#replayAudio");
  const fallback = el => { const fb = el.dataset.fallback; if (fb && !el.dataset.usedFb && !el.src.endsWith(fb)){ el.dataset.usedFb = "1"; el.src = fb; if (el===v) v.play().catch(()=>{}); } };
  v.addEventListener("error", ()=>fallback(v)); a.addEventListener("error", ()=>{ fallback(a); if (started){ started = false; } });
  const startAudio = ()=>{
    started = true;
    try{ a.currentTime = 0; }catch(e){}
    a.play().then(()=>{ btn.hidden = true; })
      .catch(()=>{ started = false; btn.hidden = false; hint.textContent = t("soundBlocked"); });
  };
  v.addEventListener("playing", ()=>{ if (!started) startAudio(); else if (!a.ended && a.paused) a.play().catch(()=>{}); });
  v.addEventListener("pause", ()=>{ if (!a.ended) a.pause(); });
  a.addEventListener("ended", ()=>{ again.hidden = false; });
  btn.addEventListener("click", ()=>{ try{ v.currentTime = 0; }catch(e){} v.play().catch(()=>{}); startAudio(); });
  again.addEventListener("click", ()=>{ again.hidden = true; try{ v.currentTime = 0; }catch(e){} v.play().catch(()=>{}); startAudio(); });
  if (!v.paused && v.readyState >= 3) startAudio();
}

}

/* ---------- temporizador ---------- */
const fmtS = s => s<0 ? "+"+fmt(-s) : fmt(s);
function paintTimer(){
  const st = STEPS[S.step], ft = $("#footTimer");
  if (!st || st.t!=="qa"){ ft.hidden = true; return; }
  const ev = st.ev, e = EVENTS[ev], q = Q(ev), running = T.running && T.ev===ev;
  const label = running ? t("pause") : (q.started ? t("resume") : t("startT"));
  const box = $("#timerBox");
  if (box){
    $("#tval").textContent = fmtS(q.left);
    $("#tbar").style.width = Math.max(0, 100*q.left/(e.min*60))+"%";
    box.classList.toggle("low", q.left<=30 && q.left>0);
    box.classList.toggle("end", q.left<=0);
    $("#trow").innerHTML = q.saved ? `<span class="hint">${t("timeUsed", fmt(q.used))}</span>`
      : `<button class="btn pink" id="tstart">${label}</button>${q.left<=0?`<span class="hint over">${t("timeUp")}</span>`:""}`;
  }
  ft.hidden = false;
  ft.className = "foot-timer" + (q.left<=0 ? " end" : q.left<=30 ? " low" : "");
  ft.innerHTML = `<span>${fmtS(q.left)}</span>${q.saved ? "" : `<button class="btn sm" id="tstart2">${label}</button>`}`;
}
function beep(){
  try{ const ac=T.ac; if(!ac) return; [0,0.3,0.6].forEach(d=>{ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=880; g.gain.setValueAtTime(0.0001,ac.currentTime+d); g.gain.exponentialRampToValueAtTime(0.25,ac.currentTime+d+0.02); g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d+0.22); o.connect(g).connect(ac.destination); o.start(ac.currentTime+d); o.stop(ac.currentTime+d+0.25); }); }catch(e){}
}
function stopTimer(){ T.running=false; clearInterval(T.iv); T.iv=null; }
function toggleTimer(){
  const ev = STEPS[S.step].ev, q = Q(ev);
  if (q.saved) return;
  if (!T.ac){ try{ T.ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if (T.running && T.ev===ev){ stopTimer(); persist(); paintTimer(); return; }
  stopTimer(); T.ev = ev; T.running = true;
  const first = !q.started; q.started = true;
  T.iv = setInterval(()=>{
    q.left--; q.used++;
    if (q.left===0) beep();
    if (q.used % 10 === 0) persist();
    paintTimer();
  }, 1000);
  persist();
  if (first){ const y = window.scrollY; render(); window.scrollTo({top:y}); } else paintTimer();
}
function finishStage(){
  const ev = STEPS[S.step].ev, q = Q(ev);
  if (!q.started) return;
  stopTimer(); q.saved = true; persist(true);
  render();
  const c = $("#checkBox"); if (c) c.scrollIntoView({behavior:"smooth", block:"start"});
}

/* ---------- reporte PDF corporativo ---------- */
function buildPdf(){
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const W = 210, M = 18, CW = W - 2*M, BOTTOM = 279;
  const C = {green:[3,35,13], mid:[10,58,27], pink:[255,116,207], cream:[246,239,228], ink:[22,38,26], gray:[90,104,94], tint:[238,243,238], line:[214,224,215], good:[29,122,67], bad:[179,38,30], white:[255,255,255]};
  const team = S.team || t("teamDefault");
  const clean = s => String(s==null?"":s).replace(/[“”«»]/g,'"').replace(/[‘’]/g,"'").replace(/[—–]/g,"-").replace(/…/g,"...").replace(/[^\x00-\xFF\n]/g,"");
  const PT = 0.3528;
  let y = 0;

  function contHeader(){
    doc.setFillColor(...C.green); doc.rect(0,0,W,13,"F");
    doc.setFillColor(...C.pink); doc.rect(0,13,W,0.8,"F");
    doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(...C.cream);
    doc.text(clean(t("pdfHeader")), M, 8.3);
    doc.setFont("helvetica","normal"); doc.setTextColor(...C.pink);
    doc.text(clean(team), W-M, 8.3, {align:"right"});
    y = 24;
  }
  function ensure(h){ if (y + h > BOTTOM){ doc.addPage(); contHeader(); } }
  function text(str, o={}){
    const size=o.size||10, lh=(o.lh||1.45)*size*PT, x=o.x||M, w=o.w||CW;
    doc.setFont("helvetica", o.bold?"bold":(o.italic?"italic":"normal")); doc.setFontSize(size); doc.setTextColor(...(o.color||C.ink));
    const lines = doc.splitTextToSize(clean(str), w);
    lines.forEach(l=>{
      ensure(lh);
      if (o.bar){ doc.setFillColor(...o.bar); doc.rect(M, y, 0.9, lh, "F"); }
      doc.text(l, x, y + size*PT*0.9);
      y += lh;
    });
  }
  let secN = 0;
  function section(title){
    ensure(22); y += 5; secN++;
    doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(...C.pink);
    doc.text(String(secN).padStart(2,"0"), M, y+4);
    doc.setFontSize(15); doc.setTextColor(...C.green);
    doc.text(clean(title), M+9, y+4.6);
    y += 8; doc.setDrawColor(...C.pink); doc.setLineWidth(0.6); doc.line(M, y, M+CW, y);
    y += 6;
  }
  function band(left, right){
    ensure(14);
    doc.setFillColor(...C.tint); doc.roundedRect(M, y, CW, 10, 1.5, 1.5, "F");
    doc.setFillColor(...C.green); doc.rect(M, y, 2, 10, "F");
    doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(...C.green);
    doc.text(clean(left), M+6, y+6.6);
    if (right){ doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...C.gray); doc.text(clean(right), M+CW-4, y+6.6, {align:"right"}); }
    y += 14;
  }
  function qa(q, a, n){
    ensure(16);
    text((n?n+". ":"")+q, {bold:true, size:10.5, color:C.green});
    y += 1.2;
    const has = a && String(a).trim();
    text(has ? a : t("noAnswer"), {x:M+4, w:CW-4, size:10, color:has?C.ink:C.gray, italic:!has, bar:C.pink});
    y += 4;
  }
  function checkItem(label, yes){
    const size=10, lh=1.4*size*PT;
    const tag = clean(yes?t("considered"):t("notConsidered"));
    doc.setFont("helvetica","bold"); doc.setFontSize(8); const tagW = doc.getTextWidth(tag);
    doc.setFont("helvetica","normal"); doc.setFontSize(size);
    const lines = doc.splitTextToSize(clean(label), CW-9-tagW-6);
    ensure(lines.length*lh + 2);
    const cy = y + 2.2;
    if (yes){ doc.setFillColor(...C.good); doc.circle(M+2, cy, 1.8, "F"); doc.setDrawColor(...C.white); doc.setLineWidth(0.5); doc.line(M+1.1, cy, M+1.8, cy+0.7); doc.line(M+1.8, cy+0.7, M+3, cy-0.8); }
    else { doc.setDrawColor(...C.bad); doc.setLineWidth(0.45); doc.circle(M+2, cy, 1.7, "S"); }
    doc.setFont("helvetica","normal"); doc.setFontSize(size); doc.setTextColor(...C.ink);
    lines.forEach((l,i)=>doc.text(l, M+7, y + size*PT*0.9 + i*lh));
    doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(...(yes?C.good:C.bad));
    doc.text(tag, M+CW, y + size*PT*0.9, {align:"right"});
    y += lines.length*lh + 2.2;
  }

  function sub(title){ ensure(14); y += 2; text(title.toUpperCase(), {bold:true, size:8.5, color:C.pink}); y += 1.5; }
  function minor(title){ ensure(12); text(title, {bold:true, size:10.5, color:C.green}); y += 1; }
  function table(heads, rows, ws){
    const size = 9.2, lh = 1.35*size*PT, pad = 2;
    const xs = []; let acc = M; ws.forEach(w=>{ xs.push(acc); acc += w*CW; });
    const head = ()=>{ ensure(16); doc.setFillColor(...C.green); doc.rect(M, y, CW, 7, "F"); doc.setFont("helvetica","bold"); doc.setFontSize(8.3); doc.setTextColor(...C.cream); heads.forEach((h2,i)=>doc.text(clean(h2), xs[i]+pad, y+4.7)); y += 7; };
    head();
    rows.forEach((r,ri)=>{
      doc.setFont("helvetica","normal"); doc.setFontSize(size);
      const cells = r.map((c,i)=>doc.splitTextToSize(clean(has(c)?c:"-"), ws[i]*CW-2*pad));
      const hgt = Math.max(...cells.map(c=>c.length))*lh + 2*pad;
      if (y + hgt > BOTTOM){ doc.addPage(); contHeader(); head(); }
      if (ri%2===1){ doc.setFillColor(...C.tint); doc.rect(M, y, CW, hgt, "F"); }
      doc.setFont("helvetica","normal"); doc.setFontSize(size); doc.setTextColor(...C.ink);
      cells.forEach((c,i)=>c.forEach((l,j)=>doc.text(l, xs[i]+pad, y+pad+size*PT*0.9+j*lh)));
      y += hgt; doc.setDrawColor(...C.line); doc.setLineWidth(0.2); doc.line(M, y, M+CW, y);
    });
    y += 4;
  }
  /* FISA como tablero de 4 columnas; el contenido fluye entre páginas */
  function pdfFisa(f){
    const ws = [0.25,0.25,0.25,0.25], pad = 2.2, size = 8.6, lh = 1.32*size*PT;
    const xs = ws.map((w,i)=>M + ws.slice(0,i).reduce((a,b)=>a+b,0)*CW);
    const heads = t("colH").map((x,i)=>`${i+1}. ${x}`);
    const sel = selImpacts(f), partes = f.partes.filter(p=>has(p.nombre)), plan = f.plan.filter(p=>has(p.accion));
    const lines = (parts)=>{ const out=[]; parts.forEach(([b,t])=>{ if (b){ doc.setFont("helvetica","bold"); doc.setFontSize(size); doc.splitTextToSize(clean(b), ws[0]*CW-2*pad).forEach(l=>out.push({b:true,t:l})); } if (t!=null){ doc.setFont("helvetica","normal"); doc.setFontSize(size); doc.splitTextToSize(clean(has(t)?t:"-"), ws[0]*CW-2*pad).forEach(l=>out.push({b:false,t:l})); } out.push({gap:true}); }); return out; };
    const cols = [
      lines(FISA_H.map(x=>[`${x.pre} ${x.b}`, f.hechos[x.k]])),
      lines([...(sel.length ? sel.map(x=>[`${x.row} · ${x.col}`, x.text]) : [[t("impsImportant"), t("noImpSel")]]), [t("probEval"), f.impactos.evaluacion]]),
      lines(partes.length ? partes.map(p=>[p.nombre, `${p.clase?CLASES.find(c=>c.k===p.clase).label:t("unclassified")} · ${t("inChargeOf", p.resp?(RN[p.resp]||p.resp):t("unassigned"))}`]) : [[t("colH")[2], t("noStake")]]),
      lines([...(plan.length ? plan.map(p=>[p.accion, `${has(p.persona)?p.persona:t("noOwner")}${p.area?" · "+(RN[p.area]||p.area):""}`]) : [[t("actions"), t("noActions")]]), [t("noActionHdr"), noAction(f).length ? noAction(f).map(k=>RN[k]).join(", ") : t("noneAllHave")]])
    ];
    const head = ()=>{
      ensure(30);
      doc.setFillColor(...C.green); doc.rect(M, y, CW, 6.5, "F");
      doc.setFont("helvetica","bold"); doc.setFontSize(7.5); doc.setTextColor(...C.pink);
      doc.text(clean(t("banner").toUpperCase()), M+CW/2, y+4.3, {align:"center"}); y += 6.5;
      doc.setFillColor(...C.mid); doc.rect(M, y, CW, 8, "F");
      doc.setFontSize(9); doc.setTextColor(...C.cream);
      heads.forEach((h2,i)=>doc.text(clean(h2), xs[i]+pad, y+5.3)); y += 8;
    };
    head();
    const idx = [0,0,0,0];
    while (idx.some((v,i)=>v<cols[i].length)){
      const top = y, room = BOTTOM - y - pad;
      let maxH = 0;
      cols.forEach((c,i)=>{
        let yy = top + pad;
        while (idx[i] < c.length){
          const L = c[idx[i]], step = L.gap ? 1.6 : lh;
          if (yy + step - top > room) break;
          if (!L.gap){ doc.setFont("helvetica", L.b?"bold":"normal"); doc.setFontSize(size); doc.setTextColor(...(L.b?C.green:C.ink)); doc.text(L.t, xs[i]+pad, yy + size*PT*0.9); }
          yy += step; idx[i]++;
        }
        maxH = Math.max(maxH, yy - top);
      });
      const hgt = maxH + pad;
      doc.setDrawColor(...C.line); doc.setLineWidth(0.25); doc.rect(M, top, CW, hgt, "S");
      xs.slice(1).forEach(x=>doc.line(x, top, x, top+hgt));
      y = top + hgt;
      if (idx.some((v,i)=>v<cols[i].length)){ doc.addPage(); contHeader(); head(); }
    }
    y += 5;
  }
  /* análisis de impactos: Impacto × Inmediato / Futuro / Potencial */
  function pdfImpacts(f){
    const ws = [0.19,0.27,0.27,0.27], pad = 2, size = 8.6, lh = 1.32*size*PT;
    const xs = ws.map((w,i)=>M + ws.slice(0,i).reduce((a,b)=>a+b,0)*CW);
    const head = ()=>{ ensure(20); doc.setFillColor(...C.green); doc.rect(M, y, CW, 7, "F"); doc.setFont("helvetica","bold"); doc.setFontSize(8.5); doc.setTextColor(...C.cream);
      [t("impact"), ...IMP_COLS.map(c=>c.label)].forEach((h2,i)=>doc.text(clean(h2), xs[i]+pad, y+4.7)); y += 7; };
    head();
    IMP_ROWS.forEach(r=>{
      doc.setFont("helvetica","normal"); doc.setFontSize(size);
      const cells = IMP_COLS.map(c=>f.impactos.cells[r.k+"|"+c.k] || {text:"", imp:false});
      const txt = cells.map(c=>doc.splitTextToSize(clean(has(c.text)?c.text:"-"), ws[1]*CW-2*pad));
      const lab = doc.splitTextToSize(clean(r.label), ws[0]*CW-2*pad);
      const extra = cells.some(c=>c.imp&&has(c.text)) ? 4 : 0;
      const hgt = Math.max(lab.length, ...txt.map(t=>t.length))*lh + 2*pad + extra;
      if (y + hgt > BOTTOM){ doc.addPage(); contHeader(); head(); }
      doc.setFillColor(...C.tint); doc.rect(M, y, ws[0]*CW, hgt, "F");
      doc.setFont("helvetica","bold"); doc.setFontSize(size); doc.setTextColor(...C.green);
      lab.forEach((l,j)=>doc.text(l, xs[0]+pad, y+pad+size*PT*0.9+j*lh));
      cells.forEach((c,i)=>{
        const x = xs[i+1], imp = c.imp && has(c.text);
        if (imp){ doc.setFillColor(255,232,246); doc.rect(x, y, ws[i+1]*CW, hgt, "F"); doc.setDrawColor(...C.pink); doc.setLineWidth(0.6); doc.rect(x+0.3, y+0.3, ws[i+1]*CW-0.6, hgt-0.6, "S");
          doc.setFont("helvetica","bold"); doc.setFontSize(6.5); doc.setTextColor(194,24,126); doc.text(clean(t("impUp")), x+pad, y+pad+2); }
        doc.setFont("helvetica","normal"); doc.setFontSize(size); doc.setTextColor(...(has(c.text)?C.ink:C.gray));
        txt[i].forEach((l,j)=>doc.text(l, x+pad, y+pad+(imp?4:0)+size*PT*0.9+j*lh));
      });
      doc.setDrawColor(...C.line); doc.setLineWidth(0.2); doc.rect(M, y, CW, hgt, "S"); xs.slice(1).forEach(x=>doc.line(x, y, x, y+hgt));
      y += hgt;
    });
    y += 3;
    qa(t("probEval"), f.impactos.evaluacion);
  }

  /* portada */
  doc.setFillColor(...C.green); doc.rect(0,0,W,62,"F");
  doc.setFillColor(...C.mid); doc.rect(W-62,0,62,62,"F");
  doc.setFillColor(...C.pink); doc.rect(0,62,W,1.4,"F");
  doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(...C.pink);
  doc.text(clean(t("pdfKicker")), M, 17);
  doc.setFontSize(28); doc.setTextColor(...C.cream);
  doc.text(clean(t("pdfTitle")), M, 33);
  doc.setFont("helvetica","normal"); doc.setFontSize(12);
  doc.text(clean(t("pdfSub")), M, 42);
  doc.setFontSize(10); doc.setTextColor(...C.pink);
  doc.text(clean(team) + "   ·   " + clean(fmtDate(S.started)), M, 52);
  y = 72;

  /* indicadores */
  const ess = ROLES.filter(r=>r.need), essOn = ess.filter(r=>A(r.k)).length;
  const qsTime = STAGES.reduce((a,stg)=>a+(Q(stg.ev).used||0),0);
  const okPts = STAGES.reduce((a,stg)=>a+Q(stg.ev).checks.filter(Boolean).length,0);
  const allPts = STAGES.reduce((a,stg)=>a+EVENTS[stg.ev].chk.length,0);
  const kpis = [[fmt(totalSeconds()),t("kTotal")],[fmt(qsTime),t("kDec")],[essOn+"/"+ess.length,t("kAreas")],[okPts+"/"+allPts,t("kPts")]];
  const tw = (CW - 3*4)/4;
  kpis.forEach((k,i)=>{
    const x = M + i*(tw+4);
    doc.setFillColor(...C.tint); doc.roundedRect(x, y, tw, 24, 2, 2, "F");
    doc.setFillColor(...C.pink); doc.rect(x, y, tw, 1.2, "F");
    doc.setFont("helvetica","bold"); doc.setFontSize(17); doc.setTextColor(...C.green);
    doc.text(clean(k[0]), x+4, y+12);
    doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor(...C.gray);
    doc.text(doc.splitTextToSize(clean(k[1]), tw-8), x+4, y+18);
  });
  y += 32;

  /* contexto */
  doc.setFillColor(...C.tint);
  doc.setFont("helvetica","normal"); doc.setFontSize(10);
  const ctxLines = doc.splitTextToSize(clean(CONTEXTO), CW-12);
  const ch = 10 + ctxLines.length*5;
  doc.roundedRect(M, y, CW, ch, 2, 2, "F"); doc.setFillColor(...C.pink); doc.rect(M, y, 1.4, ch, "F");
  doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(...C.pink); doc.text(clean(t("ctxUp")), M+6, y+6);
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(...C.ink); doc.text(ctxLines, M+6, y+11.5);
  y += ch + 4;

  /* activación */
  section(t("actTitle"));
  qa(t("whyCrisis"), S.why);
  ensure(10);
  text(t("areasInv"), {bold:true, size:10.5, color:C.green}); y += 1.5;
  const areas = ROLES.filter(r=>A(r.k)||r.need);
  const colW = CW/2;
  for (let i=0;i<areas.length;i+=2){
    ensure(7);
    [areas[i], areas[i+1]].forEach((r,j)=>{
      if (!r) return;
      const x = M + j*colW, good = rv(r)==="good";
      doc.setFillColor(...(good?C.good:C.bad)); doc.circle(x+1.6, y+2.3, 1.3, "F");
      doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(...C.ink); doc.text(clean(r.name), x+5, y+3.3);
      doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...(good?C.good:C.bad));
      doc.text(clean(A(r.k)?(r.need?t("aOkC"):t("aWrongC")):t("aMissC")), x+5, y+7);
    });
    y += 10;
  }
  if ((S.lateAreas||[]).length){ y += 2; qa(t("lateDuring"), S.lateAreas.map(x=>`${RN[x.k]} (${t("evShort", EVENTS[x.ev].n)})`).join(", ")); }

  /* eventos con decisiones */
  section(t("decByEvent"));
  STAGES.forEach((stg,si)=>{
    const e = EVENTS[stg.ev], q = Q(stg.ev);
    band(`${t("event", e.n)}  ·  ${e.when}`, t("timeUsedOf", fmt(q.used), e.min));
    sub("1. FISA" + (q.fisa.mode==="copy" ? t("fisaCopyOf", si>0?evN(si-1):"") : ""));
    pdfFisa(q.fisa);
    sub(t("impAnalysis"));
    pdfImpacts(q.fisa);
    sub(t("tabQs"));
    e.qs.forEach((x,i)=>qa(x, q.answers[i], i+1));
    sub(t("checkTitle"));
    if (q.none){ text(t("noneOpt")+".", {size:10, color:C.bad, bold:true}); y += 1; }
    e.chk.forEach((x,i)=>checkItem(x, !!q.checks[i]));
    y += 6;
  });

  /* cierre */
  section(t("closingQs"));
  CLOSING_Q.forEach((x,i)=>qa(x, S.closing[i], i+1));

  section(t("finalT"));
  FINAL.forEach(f=>qa(f.label, S.final[f.k]));

  /* pie de página */
  const n = doc.getNumberOfPages();
  for (let i=1;i<=n;i++){
    doc.setPage(i);
    doc.setDrawColor(...C.line); doc.setLineWidth(0.3); doc.line(M, 286, W-M, 286);
    doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor(...C.gray);
    doc.text(clean(t("footer")), M, 290.5);
    doc.setTextColor(...C.green); doc.setFont("helvetica","bold");
    doc.text(clean(t("page", i, n)), W-M, 290.5, {align:"right"});
  }
  return doc.output("blob");
}

/* ---------- navegación ---------- */
function blocked(){
  const st = STEPS[S.step];
  if (st.t==="crisis") return !S.areasDone ? t("blkCrisis") : "";
  if (st.t==="qa") return !Q(st.ev).saved ? t("blkQa") : "";
  return "";
}
function renderFoot(){
  const st = STEPS[S.step], b = blocked();
  const names = {crisis:t("nActivation"), qa:t("nDec"), closing:t("closingQs"), final:t("finalT"), report:t("nReport")};
  const where = st.ev!=null ? `${t("event", EVENTS[st.ev].n)} · ` + (st.t==="video" ? t("nVideo") : names[st.t]) : names[st.t];
  $("#where").textContent = b ? `${where} · ${b}` : where;
  const last = S.step === STEPS.length-1;
  const nx = STEPS[S.step+1];
  $("#next").textContent = st.t==="final" ? t("genReport") : (nx && nx.t==="video" ? t("evArrow", EVENTS[nx.ev].n) : t("next"));
  $("#next").disabled = !!b || last;
  $("#next").hidden = last;
}
function next(){ if (MOD || S.step<0 || blocked() || S.step>=STEPS.length-1) return; stopTimer(); S.step++; persist(); render(); }
function prev(){ stopTimer(); if (S.step>0) S.step--; else S.step=-1; persist(); render(); }

/* =========================================================
   EVENTOS
   ========================================================= */
document.addEventListener("click", async e=>{
  if (e.target.id==="modal"){ closeModal(); return; }
  const bt = e.target.closest("button"); if (!bt) return;
  if (bt.id==="mclose"){ closeModal(); return; }
  if (bt.dataset.tab){ TAB = bt.dataset.tab; const y = window.scrollY; render(); window.scrollTo({top:y}); return; }
  if (bt.dataset.mopen){ openModal(bt.dataset.mopen, bt.dataset.key||""); return; }
  if (bt.dataset.fmode){
    const st = STEPS[S.step], q = Q(st.ev);
    if (bt.dataset.fmode==="copy"){ const pf = prevFisa(st.st); if (!pf) return; q.fisa = JSON.parse(JSON.stringify(pf)); q.fisa.mode = "copy"; }
    else { q.fisa = emptyFisa(); q.fisa.mode = "new"; }
    persist(); const y = window.scrollY; render(); window.scrollTo({top:y}); return;
  }
  if (MOD && MOD.kind!=="prev"){
    const f = Q(MOD.ev).fisa;
    if (bt.dataset.mimp){ const k = bt.dataset.mimp; const c = f.impactos.cells[k] || (f.impactos.cells[k] = {text:"", imp:false}); c.imp = !c.imp; persist(); renderModal(); return; }
    if (bt.dataset.mpadd){ f.partes.push({nombre:"", clase:"", resp:""}); persist(); renderModal(`[data-mp="${f.partes.length-1}|nombre"]`); return; }
    if (bt.dataset.mpsug){ f.partes.push({nombre:bt.dataset.mpsug, clase:"", resp:""}); persist(); renderModal(); return; }
    if (bt.dataset.mpdel!=null){ f.partes.splice(+bt.dataset.mpdel, 1); persist(); renderModal(); return; }
    if (bt.dataset.maadd){ f.plan.push({accion:"", persona:"", area:""}); persist(); renderModal(`[data-ma="${f.plan.length-1}|accion"]`); return; }
    if (bt.dataset.laadd){ const sel = $("#lateSel"); const k = sel && sel.value; if (!k) return; S.lateAreas = S.lateAreas || []; if (!involved().includes(k)) S.lateAreas.push({k, ev:MOD.ev}); LATE_OPEN = true; persist(); renderModal(); return; }
    if (bt.dataset.madel!=null){ f.plan.splice(+bt.dataset.madel, 1); persist(); renderModal(); return; }
  }
  if (bt.dataset.lang){ applyLang(bt.dataset.lang); PRE_LANG = LANG; try{ localStorage.setItem("crisis-lang", LANG); }catch(e){} S.team = ($("#teamName").value||"").trim(); renderIntro(); return; }
  if (bt.id==="start"){
    const team = ($("#teamName").value||"").trim();
    applyLang(PRE_LANG);
    S = fresh(); S.team = team; S.lang = LANG; S.id = "s"+Date.now()+Math.random().toString(36).slice(2,6); S.started = Date.now(); S.step = 0;
    persist(true); render(); return;
  }
  if (bt.dataset.del){ DEL_ID = bt.dataset.del; DEL_MSG = ""; renderIntro(); return; }
  if (bt.dataset.delno){ DEL_ID = null; renderIntro(); return; }
  if (bt.dataset.delok){
    const id = bt.dataset.delok;
    try{
      if (DB) await DB.doc("sesiones/"+id).delete();
      try{ const c = JSON.parse(localStorage.getItem("crisis-current")||"null"); if (c && c.id===id) localStorage.removeItem("crisis-current"); }catch(e){}
      const m = localSessions(); delete m[id]; writeLocalSessions(m);
      PAST = PAST.filter(p=>p.id!==id); DEL_MSG = t("deleted");
    }catch(err){ DEL_MSG = t("delFail"); }
    DEL_ID = null; renderIntro(); return;
  }
  if (bt.dataset.open){ const p = PAST.find(x=>x.id===bt.dataset.open); if (p){ applyLang(p.lang||"es"); S = Object.assign(fresh(), JSON.parse(JSON.stringify(p))); S.lang = LANG; if (S.step<0) S.step=0; render(); } return; }
  if (bt.dataset.role){ if (S.areasDone) return; const k=bt.dataset.role; S.roles = A(k) ? S.roles.filter(x=>x!==k) : [...S.roles,k]; persist(); const y=window.scrollY; render(); window.scrollTo({top:y}); return; }
  if (bt.id==="confirmAreas"){ if (!S.roles.length || !S.why.trim()) return; S.areasDone = true; persist(true); const y=window.scrollY; render(); window.scrollTo({top:y}); return; }
  if (bt.id==="redoAreas"){ S.areasDone = false; persist(); const y=window.scrollY; render(); window.scrollTo({top:y}); return; }
  if (bt.id==="tstart" || bt.id==="tstart2") return toggleTimer();
  if (bt.id==="finishStage") return finishStage();
  if (bt.id==="reopen"){ const q = Q(STEPS[S.step].ev); q.saved = false; persist(); const y=window.scrollY; render(); window.scrollTo({top:y}); return; }
  if (bt.id==="next") return next();
  if (bt.id==="prev") return prev();
  if (bt.id==="newSession"){ stopTimer(); applyLang(PRE_LANG); S = fresh(); try{ localStorage.removeItem("crisis-current"); }catch(e){} render(); return; }
  if (bt.id==="dlReport"){
    const name = t("fileBase") + "-" + (S.team||t("teamDefault")).replace(/[^\wáéíóúñ-]+/gi,"-") + "-" + new Date(S.started||Date.now()).toISOString().slice(0,10) + ".pdf";
    if (!window.jspdf){ $("#dlMsg").textContent = t("pdfFail"); return; }
    try{
      const blob = buildPdf();
      if (DL) await DL.save({filename:name, data:blob});
      else { const u = URL.createObjectURL(blob); const link = document.createElement("a"); link.href = u; link.download = name; document.body.appendChild(link); link.click(); link.remove(); setTimeout(()=>URL.revokeObjectURL(u), 4000); }
      $("#dlMsg").textContent = t("dlOk");
    }
    catch(err){ $("#dlMsg").textContent = err && err.code==="cancelled" ? t("dlCancel") : t("dlFail"); }
  }
});
document.addEventListener("input", e=>{
  const el = e.target, d = el.dataset || {};
  if (d.bind==="why"){
    S.why = el.value; persist();
    const b = $("#confirmAreas"); if (b) b.disabled = !(S.roles.length && S.why.trim());
    const h = $("#crisisHint"); if (h) h.textContent = S.why.trim() ? "" : t("writeWhyFirst");
    renderFoot(); return;
  }
  if (d.ans!==undefined){ Q(STEPS[S.step].ev).answers[+d.ans] = el.value; persist(); updateTabCounts(); return; }
  if (MOD && MOD.kind!=="prev"){
    const f = Q(MOD.ev).fisa;
    if (d.mh!==undefined){ f.hechos[d.mh] = el.value; persist(); return; }
    if (d.mie!==undefined){ f.impactos.evaluacion = el.value; persist(); return; }
    if (d.mc!==undefined){ const c = f.impactos.cells[d.mc] || (f.impactos.cells[d.mc] = {text:"", imp:false}); c.text = el.value; persist(); return; }
    if (d.mp!==undefined){ const [i,k] = d.mp.split("|"); if (f.partes[+i]) f.partes[+i][k] = el.value; persist(); return; }
    if (d.ma!==undefined){ const [i,k] = d.ma.split("|"); if (f.plan[+i]) f.plan[+i][k] = el.value; persist(); if (k==="area") renderModal(); else refreshNoAction(f); return; }
  }
  if (d.close!==undefined){ S.closing[+d.close] = el.value; persist(); return; }
  if (d.final!==undefined){ S.final[d.final] = el.value; persist(); return; }
});
document.addEventListener("change", e=>{
  const el = e.target;
  if (el.dataset && el.dataset.chk!==undefined){
    const q = Q(STEPS[S.step].ev); q.checks[+el.dataset.chk] = el.checked;
    if (el.checked && q.none){ q.none = false; const n = document.querySelector('[data-none]'); if (n) n.checked = false; }
    persist(); return;
  }
  if (el.dataset && el.dataset.none!==undefined){
    const q = Q(STEPS[S.step].ev); q.none = el.checked;
    if (el.checked){ q.checks = q.checks.map(()=>false); document.querySelectorAll('[data-chk]').forEach(c=>c.checked=false); }
    persist();
  }
});
document.addEventListener("keydown", e=>{
  if (e.key==="Escape" && MOD){ closeModal(); return; }
  if (MOD) return;
  if (e.target.matches("textarea,input,select")) return;
  if (S.step<0) return;
  if (e.key==="ArrowRight") next();
  else if (e.key==="ArrowLeft") prev();
});
function updateTabCounts(){
  const st = STEPS[S.step]; if (!st || st.t!=="qa") return;
  const q = Q(st.ev), e = EVENTS[st.ev];
  const set = (k, v)=>{ const b = document.querySelector(`[data-tab="${k}"] small`); if (b) b.textContent = v; };
  set("preguntas", `${q.answers.filter(has).length}/${e.qs.length}`);
}
setInterval(()=>{ const el=$("#elapsed"); if (el && S.started) el.textContent = fmt(totalSeconds()); }, 1000);

/* =========================================================
   ARRANQUE
   ========================================================= */
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot){ try{ hot.snapshot(()=>({S})); }catch(e){} }
function start(data){
  if (data && data.S) S = data.S;
  else { try{ const c = JSON.parse(localStorage.getItem("crisis-current")||"null"); if (c && c.id && !c.ended) S = Object.assign(fresh(), c); }catch(e){} }
  render();
}
if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});

loadLocalPast(); if (S.step<0) renderIntro();
(async ()=>{
  if (!window.claude || !window.claude.use) return;
  try{
    const [db, dl] = await Promise.all([claude.use("db"), claude.use("downloads")]);
    DB = db; DL = dl;
    if (DB){
      DB.collection("sesiones").onSnapshot(snap=>{
        PAST = snap.docs.map(d=>Object.assign({id:d.id}, d.data())).filter(x=>x.started).sort((a,b)=>b.started-a.started);
        if (S.step<0) renderIntro();
      }, ()=>{});
      if (S.id) persist(true);
    }
  }catch(e){}
})();
</script>
